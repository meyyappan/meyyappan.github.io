{{ define "main" }}
<div class="container">
  <article>
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      {{ if eq .Section "posts" }}
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        <span>{{ .ReadingTime }} min read</span>
      </div>
      {{ end }}
      {{ with .Params.tags }}
      <div class="tags">
        {{ range . }}<a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" class="tag">{{ . }}</a>{{ end }}
      </div>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
